<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ACE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:system-ui,sans-serif;max-width:960px;margin:24px auto;padding:0 20px;color:#1a1a1a}
    h1{margin-bottom:2px}.muted{color:#666;font-size:14px}
    textarea{width:100%;height:120px;padding:10px;border:1px solid #ccc;border-radius:6px}
    input,select{padding:8px;border:1px solid #ccc;border-radius:6px;margin:4px 0}
    input.full{width:100%}
    button{padding:9px 16px;margin:4px 4px 4px 0;cursor:pointer;border:1px solid #333;border-radius:6px;background:#fff}
    button.primary{background:#2c3e50;color:#fff;border-color:#2c3e50}
    button.sm{padding:4px 10px;font-size:13px}
    .card{border:1px solid #ddd;padding:14px;margin:12px 0;border-radius:8px;background:#fff}
    .threat.rejected{opacity:.4}.threat.accepted{border-color:#27ae60}.threat.pending{border-color:#f39c12}
    .critical{border-left:6px solid #c0392b}.high{border-left:6px solid #e67e22}
    .medium{border-left:6px solid #f1c40f}.low{border-left:6px solid #27ae60}
    .soc2{color:#2980b9;font-size:13px}
    .badge{font-size:12px;padding:2px 8px;border-radius:10px;color:#fff}
    .b-pending{background:#f39c12}.b-accepted{background:#27ae60}.b-rejected{background:#c0392b}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .dash{display:flex;gap:16px;flex-wrap:wrap}
    .metric{background:#f5f6fa;border-radius:8px;padding:16px;min-width:120px;text-align:center}
    .metric b{font-size:26px;display:block}
    .bar{height:14px;border-radius:7px;background:#eee;overflow:hidden;margin:8px 0}
    .bar>span{display:block;height:100%;background:#27ae60}
    .drop{border:2px dashed #aaa;border-radius:8px;padding:24px;text-align:center;color:#666;cursor:pointer}
    footer{margin-top:40px;font-size:13px;color:#888}
  </style>
</head>
<body>
  <h1>ACE</h1>
  <p class="muted">Upload your infrastructure → one click → auditor-ready threat model + compliance dashboard.
     AI threats start as <b>pending</b> until you approve them.</p>
  <div id="authbar"></div>

  <div class="card">
    <div class="row">
      <button class="primary" id="btnTabFile">Upload Config (One-Click)</button>
      <button id="btnTabText">Describe Manually</button>
      <button id="btnTabGithub">Import from GitHub</button>
    </div>
    <div id="tab-file">
      <input id="fname" class="full" placeholder="Project name" maxlength="200">
      <div class="drop" id="drop">Drop a Terraform / Kubernetes / Dockerfile / docker-compose file here, or click to select
        <input type="file" id="fileInput" style="display:none">
      </div>
      <p class="muted" id="fstatus"></p>
    </div>
    <div id="tab-text" style="display:none">
      <input id="name" class="full" placeholder="Project name" maxlength="200">
      <textarea id="desc" placeholder="Describe your system architecture..." maxlength="8000"></textarea>
      <button class="primary" id="btnDemo">Generate (Free Demo)</button>
      <button id="saveBtn">Sign in to Save + Review</button>
    </div>
    <div id="tab-github" style="display:none">
      <input id="ghname" class="full" placeholder="Project name" maxlength="200">
      <input id="ghurl" class="full" placeholder="https://github.com/owner/repo" maxlength="300">
      <button class="primary" id="btnGithub">Import + Analyze</button>
      <p class="muted" id="ghstatus"></p>
    </div>
  </div>

  <div id="dashboard"></div>
  <div id="results"></div>

  <footer><a href="/security.html">Security &amp; Privacy</a></footer>

  <script src="/app.js"></script>
</body>
</html>
