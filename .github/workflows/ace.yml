name: ACE — Privilege Analysis

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.tf'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**.tf'

jobs:
  analyze:
    name: Analyze IAM Privileges
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build ace-cli
        run: docker build -t ace-cli ./ace-cli

      - name: Run ACE analysis
        run: |
          docker run ace-cli analyze \
            --file ace-cli/test_samples/sample_lambda.py \
            --tf ace-cli/test_samples/sample_role.tf \
            --json > ace_output.json
          cat ace_output.json

      - name: Detect drift (push only)
        if: github.event_name == 'push'
        env:
          ACE_BASE_URL: ${{ secrets.ACE_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request, urllib.error

          with open('ace_output.json') as f:
              data = json.load(f)

          total_excess = sum(len(d.get('excess', [])) for d in data)
          high_risk = [
              e['action_iam']
              for d in data
              for e in d.get('excess', [])
              if e.get('severity') == 'high'
          ]

          payload = json.dumps({
              "sha": os.environ['GITHUB_SHA'],
              "ref": os.environ['GITHUB_REF'],
              "repo": os.environ['GITHUB_REPOSITORY'],
              "total_excess": total_excess,
              "high_risk_actions": high_risk,
              "drift_detected": total_excess > 0,
          }).encode()

          base_url = os.environ.get('ACE_BASE_URL', '').rstrip('/')
          req = urllib.request.Request(
              f"{base_url}/api/drift/ingest",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "X-ACE-Service-Key": os.environ.get('SUPABASE_SERVICE_KEY', ''),
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print("Drift ingested:", resp.read().decode())
          except urllib.error.HTTPError as e:
              print(f"Drift ingest warning: {e.code} {e.read().decode()}")
          except Exception as e:
              print(f"Drift ingest skipped: {e}")

          if total_excess > 0:
              print(f"DRIFT DETECTED: {total_excess} excess permissions")
              if high_risk:
                  print("HIGH RISK:", high_risk)
          else:
              print("No drift detected.")
          EOF

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        id: comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            let redRoles = [];

            const data = JSON.parse(fs.readFileSync('ace_output.json', 'utf8'));
            const totalExcess = data.reduce((sum, d) => sum + d.excess.length, 0);
            const highRisk = data.flatMap(d => d.excess)
              .filter(e => e.severity === 'high')
              .map(e => e.action_iam);

            output += `## 🔐 ACE Privilege Analysis\n\n`;
            output += `**${totalExcess} excess permissions found**\n\n`;

            if (highRisk.length > 0) {
              output += `### 🔴 HIGH severity (remove immediately)\n`;
              highRisk.forEach(a => output += `- \`${a}\`\n`);
              output += '\n';
            }

            data.forEach(delta => {
              output += `### Role: \`${delta.role_name}\`\n`;
              output += `- Patch risk: **${delta.patch_risk.toUpperCase()}**\n`;
              output += `- Excess permissions: ${delta.excess.length}\n`;
              if (delta.patch_risk === 'red') {
                redRoles.push(delta.role_arn);
                output += `\n> ⚠️ To approve this patch, comment:\n`;
                output += `> \`/ace approve ${{ github.sha }} ${delta.role_arn}\`\n`;
              }
            });

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

            core.exportVariable('RED_ROLES', JSON.stringify(redRoles));

      - name: Check approvals for red-risk roles
        if: github.event_name == 'pull_request' && env.RED_ROLES != '[]' && env.RED_ROLES != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pip install requests --quiet
          python - <<'EOF'
          import json, sys, subprocess

          roles = json.loads('${{ env.RED_ROLES }}')
          sha = '${{ github.sha }}'
          failed = []

          for role_arn in roles:
              result = subprocess.run(
                  ['python', 'ace-cli/gate_approval.py', sha, role_arn],
                  capture_output=True, text=True
              )
              print(result.stdout)
              if result.returncode != 0:
                  failed.append(role_arn)

          if failed:
              print('BLOCKED — unapproved red-risk roles:')
              for r in failed:
                  print(f'  {r}')
              sys.exit(1)
          EOF